<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>

    <fieldset>
        <legend>Biodata</legend>
        <form action="./response.html">
            <label for ='name'>Name:</label>

            <input type ="text" name ="name" id="name" placeholder="Enter your name" required> 
<br><br>
            <label for ="email">Email:</label>
            <input type="Email" name ="email" id="email" placeholder="Enter your email" required> <br><br>

            <label for ="passwd">Password:</label>
            <input type ="Password" name ="passwd" id="passwd" placeholder="Enter your password" required> <br><br>
<br><br>
 
             <label for ="Gender">Gender:</label>
             <input type="radio" name="gen" id="gen" > 
            <label for=""Female">Female</label>
            <input type="radio" name="gen" id="gen" > 
            <label for=""Male">Male</label><br><br>

            <select name="lang" id="lang">
                <option value="">Select your language</option>

                <option value="English">English</option>
                <option value="Hindi">Hindi</option>
                <option value="French">French</option>
                <option value="Spanish">Spanish</option>
            </select><br><br>

<label for ="dob">Date of Birth:</label>   
            <input type="date" name="dob" id="dob"> <br><br>


            <label for="attempt">Number of Attempts:</label>
            <input type="number" name="attempt" id="attempt" min="0"> <br><br>


            <label for="homepage">Enter your homepage:</label>
            <input type="url" name="homepage" id="homepage" > <br><br>

            <label for="resume">Upload your resume:</label>
            <input type="file" name="resume" id="resume"> <br> <br>


        </form>
    </fieldset>

</body>
</html>
